<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coherence Monitor - RNG Network</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #0f0f23; color: #0f0; }
        h1 { text-align: center; color: #0ff; }
        .source { border: 1px solid #0f0; margin: 15px 0; padding: 15px; border-radius: 8px; background: #1a1a2e; }
        .data { font-family: monospace; white-space: pre-wrap; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; margin: 5px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0ff; }
        .stats { display: flex; flex-wrap: wrap; gap: 10px; }
        .metric { background: #16213e; padding: 10px; border-radius: 4px; flex: 1; min-width: 200px; }
        .coherence { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🌍 Coherence Monitor</h1>
    <p style="text-align:center;">Like GCP: Monitoring multiple true RNG sources for deviations / coherence.<br>
    Data updates every ~10-30s (rate-limited by sources).</p>

    <div class="stats" id="stats"></div>

    <div id="sources"></div>

    <button onclick="fetchAll()">Refresh All Sources</button>
    <button onclick="analyzeCoherence()">Analyze Coherence</button>

    <script>
        // Sources: True RNGs (atmospheric, quantum, beacons)
        const sources = [
            {
                name: "random.org (Atmospheric)",
                url: "https://www.random.org/integers/?num=10&min=0&max=1&col=1&base=10&format=plain&rnd=new",
                parser: (text) => text.trim().split('\n').map(n => parseInt(n)),
                type: "binary"
            },
            {
                name: "ANU QRNG (Quantum)",
                url: "https://qrng.anu.edu.au/API/jsonI.php?length=10&type=uint8",
                parser: (json) => JSON.parse(json).data,
                type: "bytes"
            },
            {
                name: "NIST Beacon (Quantum)",
                url: "https://beacon.nist.gov/beacon/2.0/pulse/last",
                parser: (json) => {
                    const data = JSON.parse(json);
                    return Array.from(data.pulse.outputValue.match(/.{1,2}/g) || []).map(h => parseInt(h, 16) % 2);
                },
                type: "binary"
            },
            {
                name: "drand (Distributed)",
                url: "https://api.drand.sh/public/latest",
                parser: (json) => {
                    const data = JSON.parse(json);
                    return Array.from(atob(data.randomness).slice(0,10)).map(c => c.charCodeAt(0) % 2);
                },
                type: "binary"
            }
        ];

        let allData = {};

        async function fetchSource(src) {
            try {
                const response = await fetch(src.url, { mode: 'cors' });
                if (!response.ok) throw new Error('Failed');
                const raw = await response.text();
                const numbers = src.parser(raw);
                allData[src.name] = numbers;
                return { name: src.name, numbers, success: true };
            } catch (e) {
                console.error(src.name, e);
                return { name: src.name, error: e.message, success: false };
            }
        }

        async function fetchAll() {
            const container = document.getElementById('sources');
            container.innerHTML = '<p>Fetching...</p>';
            const results = await Promise.all(sources.map(fetchSource));
            
            container.innerHTML = '';
            results.forEach(res => {
                const div = document.createElement('div');
                div.className = 'source';
                if (res.success) {
                    div.innerHTML = `
